# system-thermal-daemon.conf — every tunable of SystemThermalDaemon.
#
# Deployed at /etc/system-thermal-daemon.conf (override with the
# SYSTEM_THERMAL_CONF environment variable). This file as shipped states
# EXACTLY the daemon's compiled-in defaults — the committed, measured
# values — so a missing or refused file changes nothing: the daemon
# falls back to the same numbers and logs which source it used. It
# never fails to start because this file is absent.
#
# READ BEFORE EDITING
#
# * TWO LADDERS, ONE PER COOLING SURFACE — and this file has a section
#   for each. [ally] tunes the Ally's own cpu_fan and gpu_fan (the
#   asus_custom_fan_curve hwmon, pwm1/pwm2), driven by CPU package
#   temperature. [dock] tunes the XG Mobile dock fan over USB HID,
#   driven by the eGPU's power, utilisation and temperatures. Editing
#   one CANNOT reach the other.
#
#   THE ALLY'S TWO FANS ARE ONE ZONE and there is no section for them
#   separately. They cool ONE PACKAGE — the Z1 Extreme, CPU and GPU on
#   the same die — so cooling one without the other is not a thing this
#   hardware can do. That is a property of the silicon, not a choice
#   this file gets to make.
#
#   The split exists because on 2026-08-13 a CPU spike (a `claude` CLI
#   job, no inference engine, eGPU idle at 10 W) took EVERY fan to
#   maximum. Raising the Ally fans was right; raising the dock fan,
#   which cools a separate card that was doing nothing, was not.
#
# * WHAT IS SHARED AND WHAT IS NOT. [ladder], [interlock], [coupling]
#   and [load]'s hint are the MACHINERY — the descent gating,
#   hysteresis, stability window, dwell, backoff and verification
#   streak — and both ladders walk them identically, because a
#   hysteresis that differed per surface would be two descent policies
#   wearing one name. Only SIGNALS and CURVES are per surface.
#
# * THE SCALE IS 0-255 REQUESTED, AND REQUESTED IS NOT APPLIED. Three
#   different numbers wear the same units (FINDINGS s15): a curve point
#   is a REQUEST (0-255); the controller INTERPOLATES the curve at the
#   live temperature; what actually moves air is the APPLIED duty the
#   dock reports back (GetFanSpeed byte[9]). 55 here is not "55%": the
#   committed floor's 55 interpolates to 60 at the idle 35 C and was
#   MEASURED applying 131 (51%). Never read a value in this file as a
#   promise of airflow — the daemon reads back what the fans actually
#   do, every tick, and escalates when they do not obey.
#
# * VALIDATION IS ALL-OR-NOTHING AND LOUD. On any bad value — a duty
#   below floor_duty, a non-monotonic curve, unordered or cramped
#   thresholds, a zero dwell, a key in the wrong section — the WHOLE
#   file is refused, the daemon logs CONFIG REFUSED with every reason
#   (each one naming the surface it came from), and the compiled-in
#   defaults run instead. A config is a coherent tuning, not a grab
#   bag, and a daemon that must never stop a fan does not get to start
#   on a curve that could.
#
# * THE STRUCTURAL GUARDS ARE OUT OF REACH. never_stops() clamps every
#   rung of every ladder to that surface's floor_duty at build and again
#   at its hardware apply path; clamp_to_floor() honours the dock's own
#   acceptance floors; the install re-proves both on BOTH ladders it
#   built before any value takes effect. This file can MOVE a floor; it
#   cannot remove one.
#
# * MEASURED vs DERIVED. Values marked MEASURED were read off this
#   hardware (ASUS ROG Ally RC71L + XG Mobile dock, ITE 8910 MCU) and
#   changing them is a re-measurement, not an edit. Values marked
#   DERIVED were reasoned from measured endpoints and have never been
#   individually confirmed — most values here are DERIVED. On different
#   hardware, re-measure everything MEASURED; see the bundle README.
#
# * DELIBERATELY NOT IN THIS FILE: the 10 s re-assert cadence (the dock
#   curve is volatile — FINDINGS s3 — and the stability/verify
#   arithmetic counts in its ticks); the dock's per-point acceptance
#   floors (a DEVICE property, recorded at 0,0,0,0,34,54,62,87 from
#   FINDINGS s10, re-learned live at every attach and merged upward);
#   the control socket path/group/verbs (deployed names, load-bearing);
#   which SENSOR drives which ladder and which fans it blows on (that
#   is SURFACE_SIGNALS in the daemon — hardware identity, not tuning);
#   the eGPU PCI address and hwmon names. None of those are tuning.

# ===========================================================================
# [ally] — the Ally's cpu_fan + gpu_fan. ONE package, ONE zone, ONE ladder.
# ===========================================================================
[ally]

# The cooling curve — the top of this ladder. MEASURED: this exact curve
# has run on this host since 2026-08-07 and is the reason it has not
# powered off again (the factory curve capped cpu_fan at 66/255, 26%).
# Raising it buys nothing (it already saturates by 60 C); lowering it
# re-opens the incident. The tail MUST reach 255 — validation refuses a
# curve that never finishes, because never finishing was the factory
# defect.
max_curve = 30:178 40:178 50:204 55:230 60:255 65:255 70:255 75:255

# The floor curve — the bottom of this ladder, where the Ally rests when
# the APU is idle.
#
# MEASURED, on the Ally side, 2026-08-13: with this curve the Ally fans
# ran 3900 rpm (~60%), and the full ladder walk measured
# 6500/5600/4800/4300/3900 rpm from rung 0 to rung 4.
#
# THOSE RPM FIGURES STILL HOLD UNDER THE SPLIT — same curve, same fans,
# same hwmon — because the split changed which SIGNAL walks this ladder,
# not what a rung asks for. What has changed is the CONDITION under
# which each rung is reached: these rungs now answer to Tctl (below),
# not to the eGPU's edge temperature. The rpm-per-rung table is a
# property of the curve; the temperature-per-rung table from that run
# was an eGPU measurement and belongs to [dock].
quiet_curve = 30:55 40:65 50:147 55:185 60:228 65:255 70:255 75:255

# The floor that never stops — the lowest duty ANY point of ANY rung of
# THIS ladder may request. The operator's standing requirement: "fan off
# is dangerous for prolonged use on a device that stays online 24x7."
#
# THE ALLY SIDE HAS NO DEVICE-REPORTED FLOORS AT ALL. The dock's
# firmware publishes per-point acceptance floors (0,0,0,0,34,54,62,87 —
# s10) and silently clamps requests below them; asus_custom_fan_curve
# publishes nothing and has never been probed for one. This clamp is
# therefore the ONLY thing standing between the Ally's cpu/gpu fans and
# a curve that stops them. 45 sits below every committed point (the
# curves' minimum is 55) and above the one measured stopped state (a
# zeros-at-the-low-end curve applied 0 — s13, measured on the dock).
# DERIVED from those two bounds.
#
# Raising it above 55 silently reshapes the floor curve (never_stops
# clamps every lower point up to it) — validation refuses that instead.
# 0 is refused outright: 0 would permit a stopped fan.
floor_duty = 45

# Entry threshold per rung, in degrees of CPU PACKAGE TCTL (k10temp),
# warmest first — one value per rung below the top, so the rung count
# follows from this list (four thresholds = five rungs; rung 0, the max
# curve, is unconditional). A rung may be entered (descending) only when
# Tctl has held below its threshold minus step_hysteresis_c; the moment
# Tctl exceeds the current rung's threshold this ladder goes STRAIGHT TO
# THE TOP — the rungs gate only the descent.
#
# NOT a re-scaling of the dock's numbers: the two channels share no band
# and no dynamics. MEASURED ANCHORS: idle Tctl 32.6 C (read live
# 2026-08-13 at load average 0.35); light load mid-50s; 95.0 C under
# `cmake --build -j12` and `llama-bench --device none -ngl 0`
# (FINDINGS s14). cpu_load_c (80) forces maximum by itself, so the whole
# ladder lives below it.
#
# SPACED 10 C, not the dock's 5 C, because Tctl is a far coarser signal:
# the event that motivated the split moved it +12.6 C in 20 s, and it
# swings several degrees at idle from background work, where eGPU edge
# reports in flat 1 C steps. Wide bands (8 C usable after the 2 C
# hysteresis) keep a spiky channel from walking the ladder for nothing.
# 45 sits 12 C above the measured idle so a genuinely idle APU rests at
# the floor rung; 75 sits under cpu_load_c so there is a rung between
# "warm" and "maximum" rather than a cliff. DERIVED, all four — this
# ladder has never been walked against a real sustained CPU load.
ladder_c = 75 65 55 45

# Ceiling for GRANTING `mode quiet` on this surface: Tctl at or below
# this, no significant load, sensor readable — held continuously for
# [interlock] quiet_hold_s, on BOTH surfaces (the verb is
# whole-machine). DERIVED: above the mid-50s light-load band so ordinary
# desk work does not make a grant impossible, well under cpu_load_c so a
# grant can never be issued on an APU already doing heavy work. A
# PERMISSION bound, not a resting point — ladder_c decides where the
# fans actually rest.
quiet_c = 60.0

# The rate-of-rise trip: a climb of rise_trip_c across rise_window_s on
# THIS surface's control temperature forces maximum BEFORE any absolute
# threshold is crossed. Anticipation was the only real argument for
# watching a process name, and a fast rise anticipates better than an
# identity does.
#
# DERIVED from measured slopes and inherited unchanged from the
# single-ladder daemon: 3 C/30 s is 2.5x the worst measured idle drift
# and 3x the reporting granularity. NOTE, honestly: those slopes were
# measured on the eGPU's edge channel. On Tctl this trip is what fired
# during the 2026-08-13 event (+12.6 C/20 s) — correctly for these fans
# — but it has not been characterised against ordinary desk work on this
# channel. If the Ally pair proves twitchy in the journal, this is the
# number to re-derive, and it is now safe to do so WITHOUT touching the
# dock.
rise_trip_c = 3.0
rise_window_s = 30.0

# CPU package temperature that counts as heavy work — catches builds,
# test suites and CPU inference, everything a GPU-shaped trigger misses.
# MEASURED: cmake -j12 and CPU llama-bench drove Tctl to 95.0 C; light
# load sits mid-50s. 80 is well above the light band, safely under that
# measured peak. The Ally's EC still runs every rung's protective tail
# against its own sensors — this gates ANTICIPATION, not survival.
cpu_load_c = 80.0

# ===========================================================================
# [dock] — the XG Mobile fan. A separate card, a separate enclosure, its
# own airflow: the one genuinely independent cooling surface on this desk.
# ===========================================================================
[dock]

# The cooling curve — the top of this ladder. MEASURED, same as the
# Ally's and for the same incident: the factory dock curve reached 34%
# only at 98 C, two degrees under the CTF that powered this host off.
max_curve = 30:178 40:178 50:204 55:230 60:255 65:255 70:255 75:255

# The floor curve — the bottom of this ladder, where the card RESTS when
# idle. Still a custom curve that keeps the fan turning: the dock is
# never handed back to the firmware curve while the daemon runs.
#
# MEASURED, 2026-08-13, three-point floor sweep (FINDINGS s15). Each
# floor was deployed and held ~10 minutes, chassis exhaust running,
# sampling the daemon's status socket at 5 s:
#
#   30C/40C points   interp @35C   dock applied      edge
#   89, 99           94            179  (70%)        35 C
#   70, 80           74            152  (60%)        35 C
#   55, 65           60            131  (51%)        35-36 C
#
# Zero verification failures at any floor, and edge IDENTICAL at all
# three: at idle, in this configuration, the card does not need the
# airflow. The operator chose 55/65 — the quietest of the three.
#
# THE APPLIED-PWM FIGURES ARE NOW INDEPENDENT OF ALLY STATE. They were
# measured with one curve driving both surfaces, but what the dock's
# controller applies is a function of the curve IT is sent and the
# temperature IT reads — so the numbers carry over, while the sweep's
# Ally rpm column belongs to [ally] and is not re-attributed here.
#
# VALIDATED AS A RESTING FLOOR IN THE NORMAL CONFIGURATION ONLY: every
# sweep point ran with the supplementary chassis exhaust on. Without
# the exhaust this is a starting state, not a resting one — an idle
# card short of airflow drifts (+2.4 C/min measured on zero cooling,
# s11) and the ladder's total ascent is what protects it: designed and
# observed, but not measured at this floor.
quiet_curve = 30:55 40:65 50:147 55:185 60:228 65:255 70:255 75:255

# The floor that never stops, dock side, and the bar the daemon holds
# the read-back applied duty against every tick. Same value and same
# reasoning as the Ally's; kept per surface because the two fans have
# different controllers and nothing guarantees they stay equal after a
# re-measurement. Lowering it lowers the verify bar with it; applied 0,
# the measured stopped state, stays below any legal value, so the
# escalation survives — but the buffer shrinks.
floor_duty = 45

# Entry threshold per rung, in degrees of eGPU EDGE, warmest first.
# DERIVED from the measured range: idle sits at 35-39 C with the exhaust
# on (the sweep's floor held 35-36 C), the workload guard pauses work at
# edge 58 C, so 41 puts the bottom just above the idle band (the card
# genuinely rests instead of hovering on a boundary) and 56 keeps the
# top under the guard's pause. Spacing must exceed the hysteresis or the
# file is refused — a 1 C usable band dithers against a sensor that
# reports in whole degrees, which is the defect this 5 C spacing fixed.
#
# THE COMMITTED LADDER, MEASURED END TO END (2026-08-13). A full descent
# on exactly these values, sampled every 5 s from the daemon's status
# socket, chassis exhaust running, card idle at 10 W. Raw capture:
# ../measurements-ladder-20260813.csv
#
#   rung  idle duty   dock applied   Ally rpm   edge
#   ----  ---------   ------------   --------   ----
#     0      178          255          6500     34 C
#     1      133          252          5600     34 C
#     2       99          193          4800     34 C
#     3       74          157          4300     35 C
#     4       55          131          3900     35-36 C
#
# Monotonic on both surfaces. Every rung turned every fan. ZERO
# verification failures across the run. The card sat at 34-36 C the
# whole way down: at idle it does not need the airflow, so the floor is
# chosen for fan health and margin, not for temperature.
#
# THAT RUN WAS TAKEN WITH ONE CURVE DRIVING BOTH SURFACES, so the two
# right-hand columns moved together by construction. Under the split
# they no longer do: the "dock applied" column still describes what this
# ladder's rungs apply, the "Ally rpm" column still describes what those
# same curve points do to the Ally fans, and the edge column is this
# surface's alone. A future run will show the two ladders at different
# rungs, and that is the change working, not a discrepancy.
ladder_c = 56 51 46 41

# Ceiling for GRANTING `mode quiet` on this surface: eGPU edge at or
# below this. EDGE is the control signal; junction is the looser ceiling
# below. DERIVED (the 45 aliases nothing — this ladder's own resting
# threshold is 41 and this grant bound deliberately did not move with
# it).
quiet_c = 45.0

# The eGPU's hotspot ceiling, serving TWO decisions with one number: a
# junction excursion past it vacates this ladder's rung straight to the
# top, and it blocks a quiet grant. Junction was measured moving 30 C in
# half a second (FINDINGS s4), so it never rate-triggers anything and is
# never a control signal — only a ceiling. The Ally has no equivalent:
# the APU publishes one package temperature and it is already this
# surface's... its own control signal.
junction_c = 55.0

# The rate-of-rise trip on eGPU EDGE. DERIVED from the measured slopes:
# 3 C/30 s is 2.5x the worst measured idle drift (+2.4 C/min on zero
# cooling, s11 — settling cannot trip it), ~1/10 of measured load onset
# (~1.1 C/s edge, s9 — real load trips in 2-3 ticks), and 3x the edge
# channel's 1 C granularity (flicker cannot sum to it).
rise_trip_c = 3.0
rise_window_s = 30.0

# eGPU power that counts as work. MEASURED endpoints: resident-but-idle
# 14B draws 10 W; generation draws 165 W. 45 sits >4x above one and
# >3x below the other. Lower it toward 10 and a resident model pins
# the fan again; raise it toward 165 and generation stops forcing
# maximum — the daemon would meet real load with temperature alone.
load_power_w = 45.0

# eGPU utilisation that counts as work, percent — work regardless of
# WHICH binary submitted it. Resident-idle reads 0; generation ~100.
load_busy_pct = 50

# ===========================================================================
# [ladder] — THE SHARED DESCENT MACHINERY. Both ladders, identically.
# ===========================================================================
[ladder]

# Entry margin under a rung's threshold, degrees C: enter rung r at or
# below (threshold - this), leave it only above the threshold, so a
# reading sitting exactly on a threshold neither enters nor leaves.
# DERIVED: one degree wider than the eGPU edge channel's 1 C reporting
# granularity. Widening it slows descent into every rung on both
# surfaces; narrowing it toward 0 invites the dither the hysteresis
# exists to stop.
step_hysteresis_c = 2.0

# One step DOWN requires that surface's control temperature stable
# across this trailing window: at least stability_min_samples samples
# spanning most of the window, every sample at or below the target
# rung's bar, and the newest no more than stability_rise_c above the
# oldest — below-the-bar alone is a level test and hunts. DERIVED: ~3
# re-assert ticks. Longer = calmer but slower descent; shorter than ~2
# ticks measures a sample, not a trend, and the file is refused at 0.
stability_window_s = 30.0
stability_min_samples = 3

# Net rise tolerated across the stability window before the reading
# counts as trending up. DERIVED: 0.5 C sits under the eGPU edge
# sensor's 1 C granularity, so any real movement blocks and a flat
# signal passes.
stability_rise_c = 0.5

# Minimum seconds between steps in EITHER direction before another step
# DOWN may be taken on that ladder (steps up never wait). Each ladder
# keeps its OWN dwell clock and its OWN backoff: a throw on one never
# spends the other's patience. DERIVED: six re-assert ticks — long
# enough to see the response to the previous step, short enough that a
# full descent completes in ~5 minutes. A thrown-back step doubles the
# wait (backoff_factor) up to the cap (backoff_max_mult x this).
min_step_dwell_s = 60.0
backoff_factor = 2.0
backoff_max_mult = 8.0

# Consecutive verifiable ticks a fan surface must read as NOT OBEYING
# (0 rpm on a real Ally tachometer, or dock applied duty below that
# surface's floor_duty) before the daemon escalates THAT LADDER to
# maximum, latches, and refuses ITS descent until the readings recover.
# The other ladder does not move: a stopped Ally fan is no evidence
# about the dock fan. DERIVED: one tick forgives a spin-up transient,
# one a flaky sample — three is the same "a sample is not a trend"
# count the stability test uses.
verify_fail_ticks = 3

# Where a fresh engine hint (an inference-engine-looking process name
# APPEARING in /proc) pre-positions BOTH ladders: a middle rung, so air
# is moving before the load lands. It is the one input the two surfaces
# share, deliberately — an engine appearing is a guess about the
# machine, not evidence about either surface — and it is affordable on
# both precisely because it is never load-bearing on either: it never
# jumps to maximum, never blocks descent, never gates quiet. DERIVED.
# Must be a valid rung index on every surface.
preposition_rung = 2

# ===========================================================================
# [interlock] — the SHARED `mode quiet` grant. One verb, one machine.
# ===========================================================================
[interlock]

# How long the interlock must hold CONTINUOUSLY before a quiet request
# is granted. Since the split, "no significant load" is TWO questions:
# the grant is the AND of both surfaces (each judged on its own signals
# and its own quiet_c), and the refusal names the surface that said no.
# The verb takes no target and never will — a verb with a target is a
# parameter by another name, and this socket is reachable
# unauthenticated on the LAN by explicit operator decision.
#
# DERIVED: ~3 re-assert ticks — the measured 86->53 C in 16 s recovery
# is only true while the fans still run, so anything shorter reads one
# sample and calls it a trend. Positive, or refused.
quiet_hold_s = 30.0

# How long a SOCKET-requested `mode max` waits for significant load to
# appear before the daemon releases the operator pin and resumes gated
# descent on both ladders. Covers "the GUI died mid-sequence and the
# fans are pinned forever". DERIVED: a 14B warm-up is minutes, a cold
# page cache makes it several — ten minutes clears both. The boot
# default is unpinned and needs no watchdog: the ladders walk down by
# themselves.
spinup_watchdog_s = 600.0

# ===========================================================================
# [coupling] — the ONE cross-surface rule that survives the split.
# ===========================================================================
[coupling]

# An inference engine loading the eGPU also heats the APU that feeds it:
# the host process doing the feeding runs on the Z1 Extreme, and the
# 165 W the card draws while generating is dissipated into a chassis the
# Ally shares. So while the DOCK ladder has been at maximum under
# sustained eGPU load, the ALLY may not rest below couple_floor_rung —
# and if it is already below, it steps up to it.
#
# A FLOOR, NEVER AN ESCALATION. "The dock is at maximum" is not evidence
# that the APU is hot, and treating it as evidence would rebuild the
# coupling this split removed with the arrow reversed. If the APU really
# heats, the Ally's own signals (rise_trip_c, cpu_load_c, its rung
# ceilings) take it to maximum on their own evidence and remain the
# load-bearing path.
#
# WHAT THIS IS BUILT ON, stated plainly because it is thin: the physical
# argument above and nothing else. Tctl under eGPU inference has NEVER
# been measured on this box — every measured Tctl figure on record comes
# from CPU-side work or idle. Set couple_floor_rung to the bottom rung
# to disable the coupling entirely; that is the honest thing to do if a
# live run shows the APU stays cool under eGPU load, and the measurement
# to do it with is the journal's own ally= field. DERIVED, both.
couple_floor_rung = 2

# How long the dock must have been at maximum UNDER LOAD before the
# Ally's floor rises — "sustained", made a number. Six re-assert ticks:
# long enough that a spike or one tick of a warm-up cannot raise the
# Ally's floor, short enough to be in place well inside a generation run
# (a 14B's warm-up alone is minutes).
couple_hold_s = 60.0

# ===========================================================================
# [load] — what the daemon looks at that is not a temperature.
# ===========================================================================
[load]

# Comm PREFIXES that read as an inference engine — A HINT, nothing
# more, and the only signal both ladders share. Never load-bearing;
# deliberately loose (15-char comm truncation makes prefixes the right
# shape; a python-hosted engine is invisible here and costs only
# spin-up seconds). Add prefixes freely; an empty list only forfeits
# the pre-position seconds. Do NOT compensate by making anything here
# load-bearing — that is the retired defect: the old comm ==
# "llama-server" trigger was wrong in both directions on one day
# (2026-08-12), blind to a cmake -j12 and a CPU llama-bench that drove
# Tctl to 95.0 C, while a resident idle 14B at 10 W held every fan at
# 100%. What forces maximum is observable LOAD, per surface, in the
# [ally] and [dock] sections above.
engine_comm_hints = llama ollama
